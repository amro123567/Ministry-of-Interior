<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CTS stack — current state</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1c2128;
    --muted: #6e7781;
    --accent: #1f6feb;
    --card-bg: #ffffff;
    --card-border: #d0d7de;
    --dashed: #adbac7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --accent: #58a6ff;
      --card-bg: #161b22;
      --card-border: #30363d;
      --dashed: #4a5560;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main {
    max-width: 760px;
    width: 100%;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }
  figure {
    margin: 0;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    color: var(--fg);
  }
  figcaption {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 12px;
    line-height: 1.5;
  }
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .legend span.swatch {
    display: inline-block;
    width: 18px;
    height: 2px;
    background: currentColor;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend span.swatch.dashed {
    background: none;
    border-top: 2px dashed currentColor;
  }
</style>
</head>
<body>
<main>
  <h1>CTS — current stack, single entry point</h1>
  <p class="subtitle">Docker Compose, three containers, one URL in.</p>

  <figure>
    <svg viewBox="0 0 720 460" role="img" aria-label="A browser connects over HTTPS on port 3443 to the frontend nginx container, which serves the React app and proxies /api/ requests to the backend Spring Boot container on port 8080, which queries the MySQL container over JDBC on port 3306. MySQL is also directly reachable from the host machine on port 3307 for database tools.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
      </defs>

      <!-- Browser -->
      <rect x="290" y="16" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="360" y="44" text-anchor="middle" font-size="13">Your browser</text>

      <!-- Docker Compose boundary -->
      <rect x="40" y="96" width="640" height="330" rx="14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.6"/>
      <text x="60" y="118" font-size="12" fill="currentColor" opacity="0.7">docker compose (3 containers)</text>

      <!-- frontend container -->
      <rect x="270" y="140" width="180" height="72" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="360" y="164" text-anchor="middle" font-size="13" font-weight="600">frontend</text>
      <text x="360" y="181" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">nginx · React build</text>
      <text x="360" y="197" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">listens :443 (ssl)</text>

      <!-- backend container -->
      <rect x="270" y="266" width="180" height="72" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="360" y="290" text-anchor="middle" font-size="13" font-weight="600">backend</text>
      <text x="360" y="307" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">Spring Boot · Java 21</text>
      <text x="360" y="323" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">listens :8080</text>

      <!-- mysql container -->
      <rect x="270" y="392" width="180" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="360" y="416" text-anchor="middle" font-size="13" font-weight="600">mysql</text>
      <text x="360" y="433" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">MySQL 8.0 · listens :3306</text>

      <!-- host DB client box, outside compose boundary -->
      <rect x="520" y="392" width="140" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
      <text x="590" y="418" text-anchor="middle" font-size="12">DB client on</text>
      <text x="590" y="434" text-anchor="middle" font-size="12">your machine</text>

      <!-- browser -> frontend -->
      <line x1="360" y1="62" x2="360" y2="140" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="374" y="102" font-size="11">https, port 3443</text>

      <!-- frontend -> backend -->
      <line x1="360" y1="212" x2="360" y2="266" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="374" y="243" font-size="11">proxy_pass /api/**</text>

      <!-- backend -> mysql -->
      <line x1="360" y1="338" x2="360" y2="392" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="374" y="369" font-size="11">JDBC, internal :3306</text>

      <!-- mysql -> host db client, port mapped -->
      <line x1="450" y1="424" x2="520" y2="424" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
      <text x="484" y="415" text-anchor="middle" font-size="10">host :3307</text>

      <!-- removed port 3000 note -->
      <rect x="60" y="140" width="150" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45"/>
      <line x1="70" y1="150" x2="200" y2="182" stroke="currentColor" stroke-width="1.2" opacity="0.45"/>
      <text x="135" y="163" text-anchor="middle" font-size="11" opacity="0.55">plain HTTP</text>
      <text x="135" y="178" text-anchor="middle" font-size="11" opacity="0.55">:3000 — removed</text>
    </svg>
    <figcaption>
      One way in now: the browser only talks to <strong>https://localhost:3443</strong>.
      nginx serves the built React app and forwards every <code>/api/**</code> call to the
      Spring Boot container over the internal Docker network — the browser never talks to
      the backend or database directly. The backend reaches MySQL the same way, over the
      internal network; MySQL is separately exposed to your host machine on port 3307 only
      so you can connect a DB client, not as a path the app itself uses. The old plain-HTTP
      port 3000 is gone — this is the state after today's single-URL cleanup.
    </figcaption>
  </figure>

  <div class="legend">
    <div><span class="swatch"></span>request / data path</div>
    <div><span class="swatch dashed"></span>host-exposed port, direct access</div>
  </div>
</main>
</body>
</html>
