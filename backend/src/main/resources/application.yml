server:
  port: 8080

spring:
  application:
    name: cts-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cts_spring_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER:cts_app}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cts:
  jwt:
    secret: ${JWT_SECRET:change-this-in-.env-to-a-long-random-string-before-running}
    access-token-minutes: 30
    refresh-token-days: 7
  security:
    max-login-attempts: 5
    lockout-minutes: 15
  storage:
    documents-dir: ${DOCUMENTS_DIR:./uploaded-documents}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.moi.cts: INFO
