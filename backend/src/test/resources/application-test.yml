spring:
  datasource:
    url: jdbc:h2:mem:cts_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

cts:
  jwt:
    secret: test-only-secret-not-for-production-use-32bytes+
    access-token-minutes: 30
    refresh-token-days: 7
  storage:
    documents-dir: ./test-uploaded-documents
