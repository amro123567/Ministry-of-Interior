# HTTPS only. The cert is a self-signed one generated at image build time
# (see frontend/Dockerfile) -- fine for a capstone demo, but browsers will
# show a "not private" warning until you click through it once, and it is
# not suitable for a real deployment. For a real Ministry deployment, this
# server block would use a CA-issued certificate (e.g. from an internal CA
# or Let's Encrypt against a real domain) mounted in from outside the image.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any path that isn't a real static file falls back to
    # index.html so client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend container. The browser only ever
    # talks to this nginx origin, so the backend's CORS config is never
    # exercised in the containerized deployment -- only in local dev,
    # where Vite's own dev-server proxy plays the same role.
    location /api/ {
        # Docker's embedded DNS + a variable makes nginx re-resolve "backend" at
        # request time. With a literal host, nginx resolves it once at start-up, so
        # after the backend container restarts (new IP) every /api call returned 502
        # until the frontend container was restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
