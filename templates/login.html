<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login — MOI Civil Registry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      padding: 36px 34px;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: #1a2a3a;
    }
    .login-card p.subtitle {
      color: #6c757d;
      margin: 0 0 24px 0;
      font-size: 0.9rem;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dcdfe3;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .field input:focus {
      outline: none;
      border-color: #2E86C1;
      box-shadow: 0 0 0 3px rgba(46,134,193,0.15);
    }
    button.submit {
      width: 100%;
      padding: 11px;
      background: #2E86C1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button.submit:hover {
      background: #256a9c;
    }
    .flash {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .flash.error { background: #fdecea; color: #a13a2f; border: 1px solid #f5c2bc; }
    .flash.success { background: #eafaf1; color: #1e7a4c; border: 1px solid #b7ebc9; }
    .flash.info { background: #eaf3fb; color: #205c85; border: 1px solid #bfe0f5; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>MOI Civil Registry</h1>
    <p class="subtitle">Sign in with your staff account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
